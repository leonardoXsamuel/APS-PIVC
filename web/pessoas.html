<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pessoas</title><link rel="stylesheet" href="style.css"></head>
<body class="admin"><main>
  <h1>Gerenciar pessoas</h1>
  <div id="saida"></div>
  <div class="card tbl"><table>
    <thead><tr><th>Nome</th><th>Matrícula</th><th>Divisão</th><th>Nível</th><th>Biometrias</th><th>Status</th><th></th></tr></thead>
    <tbody id="corpo"></tbody></table></div>
</main>
<script src="app.js"></script>
<script>
const $ = id => document.getElementById(id);
let divisoes = [], pessoas = [];

function msg(classe, t) { $("saida").innerHTML = `<div class="resultado ${classe}">${esc(t)}</div>`; }

function linha(p) {
  const nivel = [1, 2, 3].map(n => `<option ${p.nivel === n ? "selected" : ""}>${n}</option>`).join("");
  const div = `<option value="">—</option>` + divisoes.map(d => `<option value="${d.id}" ${p.divisao_id === d.id ? "selected" : ""}>${esc(d.nome)}</option>`).join("");
  return `<tr data-id="${p.id}">
    <td>${esc(p.nome)}<br><small style="color:var(--mut)">${esc(p.cargo)}</small></td><td>${esc(p.matricula)}</td>
    <td><select class="div">${div}</select></td>
    <td><select class="niv">${nivel}</select></td>
    <td>${p.biometrias}</td>
    <td><span class="pill ${p.ativo ? "ok" : "no"}">${p.ativo ? "ativo" : "inativo"}</span></td>
    <td class="row"><button class="salvar">Salvar</button>
      <button class="sec alt">${p.ativo ? "Desativar" : "Ativar"}</button>
      <button class="perigo rem">Remover</button></td></tr>`;
}

async function carregar() {
  try {
    [divisoes, pessoas] = await Promise.all([api("/api/divisoes", {}, true), api("/api/usuarios", {}, true)]);
    $("corpo").innerHTML = pessoas.map(linha).join("") || `<tr><td colspan="7">Nenhuma pessoa cadastrada.</td></tr>`;
  } catch (e) { msg("no", e.message); }
}

async function enviar(id, dados) {
  try {
    await api(`/api/usuarios/${id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dados) }, true);
    msg("ok", "Alteração salva."); carregar();
  } catch (e) { msg("no", e.message); }
}

$("corpo").onclick = async ev => {
  const tr = ev.target.closest("tr"); if (!tr || !ev.target.matches("button")) return;
  const id = tr.dataset.id, p = pessoas.find(x => x.id == id);
  if (ev.target.classList.contains("salvar")) {
    const nivel = +tr.querySelector(".niv").value;
    const dados = { nivel, divisao_id: tr.querySelector(".div").value ? +tr.querySelector(".div").value : null };
    if (nivel === 3 && !p.tem_pin) {
      const pin = prompt("Nível 3 exige um PIN de 6 dígitos:"); if (!pin) return;
      dados.pin = pin;
    }
    enviar(id, dados);
  } else if (ev.target.classList.contains("alt")) {
    enviar(id, { ativo: !p.ativo });
  } else if (ev.target.classList.contains("rem")) {
    if (ev.target.dataset.confirma !== "1") {  // confirmação em dois cliques
      ev.target.dataset.confirma = "1"; ev.target.textContent = "Confirmar?";
      return setTimeout(() => { ev.target.dataset.confirma = ""; ev.target.textContent = "Remover"; }, 3000);
    }
    try { await api(`/api/usuarios/${id}`, { method: "DELETE" }, true); msg("ok", "Pessoa removida."); carregar(); }
    catch (e) { msg("no", e.message); }
  }
};
exigirAdmin().then(carregar);
</script></body></html>
